function reveal(el) {
  el.classList.toggle("revealed");
}

function getStarKey(date, idx) {
  return `band_flash_star_${date}_${idx}`;
}

function isStarred(date, idx) {
  return localStorage.getItem(getStarKey(date, idx)) === "1";
}

function toggleStarAndRerender(date, idx, rerenderFn) {
  const key = getStarKey(date, idx);
  const cur = localStorage.getItem(key) === "1";
  localStorage.setItem(key, cur ? "0" : "1");
  rerenderFn();
}

function cardHTML(date, idx, card, onStarClick) {
  const starred = isStarred(date, idx);
  return `
    <div class="card ${starred ? "starred" : ""}">
      <div class="card-top">
        <span class="card-origin">${card.origin}</span>
        <span class="star-btn" onclick="${onStarClick}">${starred ? "★" : "☆"}</span>
      </div>
      <div class="card-text">${card.text}</div>
    </div>
  `;
}
function getOpenedEntries() {
  const now = new Date();
  return history
    .filter(h => new Date(h.openAt) <= now)
    .sort((a, b) => new Date(a.openAt) - new Date(b.openAt));
}
function renderToday() {
  const opened = getOpenedEntries();

  if (opened.length === 0) {
    document.getElementById("subjectBadge").textContent = "";
    document.getElementById("dateLabel").textContent = "";
    document.getElementById("subtopicLabel").textContent = "오늘의 지문이 준비 중이에요";
    document.getElementById("cardList").innerHTML = "";
    return;
  }

  const today = opened[opened.length - 1];
  document.getElementById("subjectBadge").textContent = today.subject;
  document.getElementById("dateLabel").textContent = today.date;
  document.getElementById("subtopicLabel").textContent = today.subtopic;

  const listEl = document.getElementById("cardList");
  listEl.innerHTML = today.cards.map((c, idx) =>
    cardHTML(today.date, idx, c, `toggleStarAndRerender('${today.date}', ${idx}, renderToday)`)
  ).join("");
}

function resetToday() {
  document.querySelectorAll("#cardList .blind-shield.revealed").forEach(el => {
    el.classList.remove("revealed");
  });
}

function openArchive() {
  document.getElementById("todayScreen").style.display = "none";
  document.getElementById("archiveScreen").style.display = "block";
  window.scrollTo(0, 0);
  renderArchive();
}

function closeArchive() {
  document.getElementById("archiveScreen").style.display = "none";
  document.getElementById("todayScreen").style.display = "block";
  window.scrollTo(0, 0);
}

let activeSubject = null;

function renderArchive() {
  const opened = getOpenedEntries();
  const past = opened.slice(0, -1); // 오늘 것 제외
  const subjects = [...new Set(past.map(h => h.subject))];

  if (subjects.length === 0) {
    document.getElementById("subjectTabs").innerHTML = "";
    document.getElementById("prevCardList").innerHTML = `<div class="empty-prev">아직 쌓인 이전 지문이 없어요. 내일부터 하나씩 쌓일 예정이에요!</div>`;
    return;
  }

  if (!activeSubject || !subjects.includes(activeSubject)) activeSubject = subjects[0];

  document.getElementById("subjectTabs").innerHTML = subjects.map(s => `
    <div class="subject-tab ${s === activeSubject ? "active" : ""}" onclick="selectSubject('${s}')">${s}</div>
  `).join("");

  const entries = past.filter(h => h.subject === activeSubject);
  const totalCards = entries.reduce((sum, h) => sum + h.cards.length, 0);

  let html = "";
  let count = 0;
  entries.forEach(h => {
    html += `<div style="font-size:12px; color:#94a3b8; margin: 14px 0 8px; padding-left:2px;">${h.date} · ${h.subtopic}</div>`;
    h.cards.forEach((c, idx) => {
      count++;
      html += `
        <div style="margin-bottom:8px;">
          ${cardHTML(h.date, idx, c, `toggleStarAndRerender('${h.date}', ${idx}, renderArchive)`)}
        </div>
      `;
      if (count % 5 === 0 && count !== totalCards) {
        html += `
          <div style="text-align:center; margin: 6px 0 16px;">
            <button class="footer-btn" onclick="resetArchive()">다시 풀어보기</button>
          </div>
        `;
      }
    });
  });
  document.getElementById("prevCardList").innerHTML = html;
}

function resetArchive() {
  document.querySelectorAll("#prevCardList .blind-shield.revealed").forEach(el => {
    el.classList.remove("revealed");
  });
}

function selectSubject(s) {
  activeSubject = s;
  renderArchive();
}

renderToday();
